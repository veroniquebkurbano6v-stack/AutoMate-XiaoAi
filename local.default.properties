## ============================================
## API Key 配置模板
## ============================================
## 使用说明：
## 1. 复制此文件并重命名为 local.properties
## 2. 填入你的 API Key
## 3. local.properties 已在 .gitignore 中，不会被提交到 git
## ============================================

# Android SDK 路径（根据你的环境修改）
sdk.dir=D\:\\Android\\SDK

# ============================================
# 一、执行模型（LLM）
# 用途：接收屏幕信息（文字+视觉描述），决策下一步操作
# ============================================
LLM_API_KEY=
LLM_API_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
LLM_MODEL=deepseek-v4-flash

# ============================================
# 二、任务决策模型（Planner）— DeepSeek
# 用途：复杂任务执行前生成分步骤操作计划
# 获取：https://platform.deepseek.com/api_keys
# ============================================
PLANNER_API_KEY=
PLANNER_API_URL=https://api.deepseek.com
PLANNER_MODEL=deepseek-v4-flash

# ============================================
# 三、视觉描述模型（VLM）— 阿里云百炼 Qwen3-VL-Flash
# 用途：对屏幕截图进行视觉描述，辅助文本执行模型理解界面
# 复用 LLM_API_KEY（同为百炼 DashScope 账号）
# ============================================
VLM_API_KEY=
VLM_API_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
VLM_MODEL=qwen3-vl-flash

# ============================================
# 四、键盘检测模型（VLM）— 智谱 GLM-4V-Flash
# 用途：检测输入框点击后键盘是否弹出（是/否判断）
# 获取：https://open.bigmodel.cn/（免费模型，注册即用）
# 未配置时自动降级使用主 VLM 模型
# ============================================
KEYBOARD_VLM_API_KEY=
KEYBOARD_VLM_API_URL=https://open.bigmodel.cn/api/paas/v4/chat/completions
KEYBOARD_VLM_MODEL=glm-4v-flash

# ============================================
# 五、屏幕描述模型（VLM）— 智谱 GLM-5.3-Flash
# 用途：每轮屏幕视觉描述（简短列出屏幕内容/元素/按钮），供执行模型理解界面
# 获取：https://open.bigmodel.cn/
# 未配置时自动回退使用 GUI-Plus（GuiOwlService.describeScreen）描述
# ============================================
SCREEN_VLM_API_KEY=
SCREEN_VLM_API_URL=https://open.bigmodel.cn/api/paas/v4/chat/completions
SCREEN_VLM_MODEL=glm-5.3-flash

# ============================================
# 六、上下文压缩模型 — 智谱 GLM-4.5-Flash
# 用途：Running Summary 历史压缩（round≥6 每 3 轮触发），独立于决策模型
# 获取：https://open.bigmodel.cn/（免费模型，注册即用）
# 未配置时回退使用决策模型（Planner）配置
# ============================================
COMPACT_API_KEY=
COMPACT_API_URL=https://open.bigmodel.cn/api/paas/v4
COMPACT_MODEL=glm-4.5-flash

# ============================================
# 七、高德地图 MCP（位置服务/地图搜索/路线规划/天气查询）
# 获取地址：https://lbs.amap.com/api/mcp-server/create-project-and-key
# 端点格式：https://mcp.amap.com/mcp?key=YOUR_API_KEY
# ============================================
AMAP_API_KEY=
AMAP_MCP_BASE_URL=https://mcp.amap.com/mcp

# ============================================
# 八、阿里云百炼 DashScope API Key（GUI-Plus 界面交互模型）
# 用途：App 直接调用云端 GUI-Plus（截图+指令 → 动作/坐标），不再依赖本地 GUI 服务
# 获取：https://bailian.console.aliyun.com/（API-KEY 管理）
# 未配置时自动回退使用 LLM_API_KEY（同为百炼 Key，共用账号额度）
# ============================================
DASHSCOPE_API_KEY=

# ============================================
# 九、端侧知识库（完全本地 RAG，无需服务端）
# App 内置 bge-small-zh ONNX 模型 + 514 条 SOP，首次启动自动建库
# 通过设置页"启用知识库"开关控制（KVUtils.isLocalKbEnabled），无配置项
# ============================================

# ============================================
# 十、执行模型联网搜索
# 博查 AI Search API（推荐，国内速度快，注册送免费额度）
# 获取地址：https://open.bochaai.com/
# 未配置 Key 时自动降级到 DuckDuckGo（完全免费但中文质量一般）
# ============================================
BOCHA_API_KEY=
EXECUTION_ENABLE_SEARCH=true
